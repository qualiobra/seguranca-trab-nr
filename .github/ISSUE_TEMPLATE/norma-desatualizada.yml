name: "Norma desatualizada"
description: "Saiu portaria nova do MTE que altera uma das 22 NRs da base"
title: "[desatualização] "
labels: ["desatualizacao"]
body:
  - type: input
    id: nr
    attributes:
      label: "NR afetada"
      placeholder: "NR-18"
    validations:
      required: true
  - type: input
    id: portaria
    attributes:
      label: "Portaria (número e data)"
      placeholder: "Portaria MTE nº XXX, de DD/MM/AAAA"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: "Link oficial (gov.br ou DOU)"
      placeholder: "https://www.gov.br/..."
    validations:
      required: true
  - type: textarea
    id: mudancas
    attributes:
      label: "O que muda (se souber)"
      description: "Itens alterados, vigência, vacatio legis"
